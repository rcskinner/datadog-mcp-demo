apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
      annotations:
        ad.datadoghq.com/demo-api.logs: '[{"source": "python", "service": "demo-api"}]'
    spec:
      containers:
        - name: demo-api
          image: demo-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: demo-api-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
